<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出退勤</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #f4f6f8; color: #222; }
  main { max-width: 440px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; text-align: center; margin: 8px 0 4px; }
  .clock { text-align: center; font-size: 34px; font-weight: bold; letter-spacing: 1px; margin-bottom: 4px; }
  .date { text-align: center; color: #666; margin-bottom: 16px; }
  label { display: block; font-size: 14px; color: #555; margin: 12px 0 4px; }
  select, input { width: 100%; font-size: 20px; padding: 10px; border: 1px solid #bbb; border-radius: 8px; background: #fff; }
  .state { margin-top: 10px; padding: 10px; border-radius: 8px; background: #fff; font-size: 15px; min-height: 22px; }
  .state b { font-size: 17px; }
  .btns { display: flex; gap: 12px; margin-top: 18px; }
  .btns button { flex: 1; height: 88px; font-size: 26px; font-weight: bold; color: #fff; border: 0; border-radius: 14px; }
  .in { background: #1e88e5; }
  .out { background: #e65100; }
  button:disabled { opacity: .45; }
  .msg { margin-top: 16px; padding: 12px; border-radius: 8px; white-space: pre-line; font-size: 16px; display: none; }
  .msg.show { display: block; }
  .msg.ok { background: #e3f4e6; color: #1b5e20; }
  .msg.warn { background: #fff3cd; color: #7a4f00; }
  .msg.err { background: #fde2e2; color: #b71c1c; }
  .msg.info { background: #e8eef6; color: #234; }
  .undo { margin-top: 12px; padding: 12px; border: 2px dashed #999; border-radius: 10px; background: #fff; text-align: center; }
  .undo button { margin-top: 8px; font-size: 18px; padding: 10px 24px; border-radius: 8px; border: 1px solid #b71c1c; color: #b71c1c; background: #fff; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal[hidden] { display: none; }
  .dialog { background: #fff; border-radius: 14px; padding: 20px; width: 100%; max-width: 380px; }
  .dialog p { font-size: 19px; line-height: 1.5; margin: 0 0 12px; white-space: pre-line; }
  .dbtns { display: flex; gap: 10px; margin-top: 16px; }
  .dbtns button { flex: 1; font-size: 19px; padding: 14px; border-radius: 10px; border: 0; }
  #modalOk { background: #1e88e5; color: #fff; font-weight: bold; }
  #modalCancel { background: #e0e0e0; }
</style>
</head>
<body>
<main>
  <h1>出退勤</h1>
  <div class="clock" id="clock">--:--:--</div>
  <div class="date" id="date"></div>

  <label for="teacher">講師名</label>
  <select id="teacher"><option value="">読み込み中…</option></select>
  <div class="state" id="state"></div>


  <div class="btns">
    <button id="btnIn" class="in">出勤</button>
    <button id="btnOut" class="out">退勤</button>
  </div>

  <div class="msg" id="msg"></div>

  <div class="undo" id="undoBox" hidden>
    <div id="undoText"></div>
    <button id="btnUndo">取り消す</button>
  </div>
</main>

<div class="modal" id="modal" hidden>
  <div class="dialog">
    <p id="modalText"></p>
    <div class="dbtns">
      <button id="modalCancel">やめる</button>
      <button id="modalOk">OK</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const DOW = ['日', '月', '火', '水', '木', '金', '土'];
let undo = null;
let undoTimer = null;

// Apps Script 上で開いたときは google.script.run、GitHub Pages などで開いたときは API_URL へ送る
const API_URL = 'https://script.google.com/macros/s/AKfycbzGpsuCEXjnCk6QQf5hMlk8x1WkafuC_36YFgBbdjuq7uhLhCPgxW13KilMiBVYVJi4/exec';
function call(fn, ...args) {
  if (window.google && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
  }
  return callApi(fn, args);
}

// Google側が一時的にエラーページを返すことがあるため、最大3回まで送り直す。
// rid（1回の操作ごとの番号）が同じ送り直しは、サーバー側で二重に実行されない。
async function callApi(fn, args) {
  const body = JSON.stringify({ fn: fn, args: args, rid: Date.now().toString(36) + Math.random().toString(36).slice(2) });
  let lastError = null;
  for (let i = 0; i < 3; i++) {
    if (i > 0) await new Promise(r => setTimeout(r, 1500 * i));
    let res;
    try {
      const text = await (await fetch(API_URL, { method: 'POST', body: body })).text();
      try {
        res = JSON.parse(text);
      } catch (e) {
        lastError = new Error('サーバーが混み合っています。少し待ってからもう一度お試しください');
        continue;
      }
    } catch (e) {
      lastError = new Error('通信できませんでした。電波の良い場所でもう一度お試しください');
      continue;
    }
    if (!res.ok) throw new Error(res.error);
    return res.result;
  }
  throw lastError;
}

function errText(e) {
  return String((e && e.message) || e).replace(/^(Exception|Error):\s*/, '');
}

function showMsg(text, kind) {
  const m = $('msg');
  m.textContent = text;
  m.className = 'msg show ' + (kind || 'info');
}

function setBusy(b) {
  $('btnIn').disabled = b;
  $('btnOut').disabled = b;
  $('btnUndo').disabled = b;
}

/** 確認ダイアログ。OKなら true、やめたら false を返す */
function ask(text) {
  return new Promise(resolve => {
    $('modalText').textContent = text;
    $('modal').hidden = false;
    const close = v => {
      $('modal').hidden = true;
      $('modalOk').onclick = $('modalCancel').onclick = null;
      resolve(v);
    };
    $('modalOk').onclick = () => close(true);
    $('modalCancel').onclick = () => close(false);
  });
}

function tick() {
  const d = new Date();
  const p = n => ('0' + n).slice(-2);
  $('clock').textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  $('date').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日（' + DOW[d.getDay()] + '）';
}

function refreshStatus() {
  const name = $('teacher').value;
  if (!name) { $('state').textContent = '講師名を選んでください'; return; }
  $('state').textContent = '確認中…';
  call('getStatus', name).then(s => {
    const list = s.punches.map(p => p.time + ' ' + p.type).join('　');
    $('state').innerHTML = '';
    const b = document.createElement('b');
    b.textContent = '今日：' + s.state;
    $('state').appendChild(b);
    if (list) $('state').appendChild(document.createTextNode('（' + list + '）'));
  }).catch(e => { $('state').textContent = errText(e); });
}

async function doPunch(type) {
  const name = $('teacher').value;
  if (!name) return showMsg('講師名を選んでください', 'err');
  if (!await ask(name + 'さん、\n' + type + 'でよろしいですか？')) return;

  setBusy(true);
  showMsg('送信中…', 'info');
  try {
    const r = await call('punch', name, type);
    showMsg(type + 'しました（' + r.time + '）' + (r.alert ? '\n⚠ ' + r.alert : ''), r.alert ? 'warn' : 'ok');
    undo = { id: r.id, name: name, type: type, time: r.time, until: r.undoUntil };
    store.set('undo', JSON.stringify(undo));
    renderUndo();
    refreshStatus();
  } catch (e) {
    showMsg(errText(e), 'err');
  } finally {
    setBusy(false);
  }
}

function renderUndo() {
  clearInterval(undoTimer);
  const box = $('undoBox');
  const update = () => {
    const left = undo ? undo.until - Date.now() : 0;
    if (!undo || undo.name !== $('teacher').value || left <= 0) {
      box.hidden = true;
      if (undo && left <= 0) { undo = null; store.del('undo'); }
      clearInterval(undoTimer);
      return;
    }
    const s = Math.ceil(left / 1000);
    $('undoText').textContent = undo.time + ' の' + undo.type + 'を間違えて押した場合は取り消せます（残り '
      + Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2) + '）';
    box.hidden = false;
  };
  update();
  undoTimer = setInterval(update, 1000);
}

async function doUndo() {
  if (!undo) return;
  const u = undo;
  if (!await ask(u.time + ' の' + u.type + 'を取り消してよろしいですか？')) return;

  setBusy(true);
  showMsg('取り消し中…', 'info');
  try {
    await call('cancelPunch', u.name, u.id);
    showMsg(u.time + ' の' + u.type + 'を取り消しました', 'ok');
    undo = null;
    store.del('undo');
    renderUndo();
    refreshStatus();
  } catch (e) {
    showMsg(errText(e), 'err');
  } finally {
    setBusy(false);
  }
}

function init() {
  tick();
  setInterval(tick, 1000);
  try { undo = JSON.parse(store.get('undo') || 'null'); } catch (e) { undo = null; }

  $('btnIn').onclick = () => doPunch('出勤');
  $('btnOut').onclick = () => doPunch('退勤');
  $('btnUndo').onclick = doUndo;
  $('teacher').onchange = () => {
    store.set('teacher', $('teacher').value);
    refreshStatus();
    renderUndo();
  };

  call('getTeachers').then(names => {
    const sel = $('teacher');
    sel.innerHTML = '';
    sel.add(new Option('選んでください', ''));
    names.forEach(n => sel.add(new Option(n, n)));
    const saved = store.get('teacher');
    if (saved && names.indexOf(saved) >= 0) sel.value = saved;
    refreshStatus();
    renderUndo();
  }).catch(e => showMsg(errText(e), 'err'));
}

init();
</script>
</body>
</html>
